<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELF.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8e8e8;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #caption {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(80, 80, 80, 0);
            font-size: 24px;
            font-weight: 300;
            text-align: center;
            pointer-events: none;
            transition: color 2s ease;
            z-index: 100;
            max-width: 80%;
            line-height: 1.6;
        }

        #caption.visible {
            color: rgba(80, 80, 80, 1);
        }

        #interaction-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(100, 100, 100, 0);
            font-size: 14px;
            font-weight: 300;
            text-align: center;
            pointer-events: none;
            transition: color 1.5s ease;
            z-index: 100;
        }

        #interaction-prompt.visible {
            color: rgba(100, 100, 100, 0.7);
        }

        canvas {
            display: block;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            cursor: pointer;
            z-index: 1000;
            transition: opacity 1.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #start-title {
            font-size: 48px;
            font-weight: 200;
            color: rgba(80, 80, 80, 0.8);
            letter-spacing: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #thank-you-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 2000;
            transition: opacity 3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            opacity: 0;
            pointer-events: none;
        }

        #thank-you-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #thank-you-message-1,
        #thank-you-message-2 {
            font-weight: 200;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            opacity: 0;
            transition: opacity 2s ease;
            max-width: 80%;
        }

        #thank-you-message-1 {
            font-size: 36px;
            letter-spacing: 4px;
            color: rgba(80, 80, 80, 0.9);
        }

        #thank-you-message-2 {
            font-size: 24px;
            letter-spacing: 2px;
            color: rgba(80, 80, 80, 0.75);
            line-height: 1.6;
        }

        #thank-you-message-1.visible,
        #thank-you-message-2.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <div id="start-title">SELF.</div>
    </div>

    <div id="thank-you-screen">
        <div id="thank-you-message-1">Thank you for playing</div>
        <div id="thank-you-message-2">Please send this to someone you care about</div>
    </div>

    <div id="canvas-container"></div>
    <div id="caption"></div>
    <div id="interaction-prompt"></div>

    <audio id="background-music" loop>
        <source src="坂本龍一 - Sadness.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game-v2.js"></script>
</body>
</html>
